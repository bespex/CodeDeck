<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeDeck: one overview for all projects, click dummy</title>

  .ti .cnt2 { position: absolute; right: 1px; top: 1px; font-size: 9px; min-width: 13px; height: 13px; line-height: 13px; border-radius: 7px; background: #4f46e5; color: #fff; text-align: center; padding: 0 2px; }
  .menu2 { position: absolute; z-index: 20; top: 40px; width: 270px; padding: 6px; border-radius: 8px; background: #2b2f35; border: 1px solid #4d545c; box-shadow: 0 10px 30px #000a; display: flex; flex-direction: column; gap: 2px; }

  .sec span { margin-left: auto; }
  .pj { position: relative; padding: 2px 0; }

  .pr:hover { background: #262a30; }
  .pr.front { border-left-color: #818cf8; background: #23272d; }

  .winmark { color: #8d949b; display: inline-flex; }

  .rest { display: inline-flex; align-items: center; }
  .pr:hover .rest, .sr:hover .rest { display: none; }
  .hi { width: 24px; height: 24px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: #b4b9be; position: relative; }

  .empty { padding: 20px; color: #6b7178; font-size: 12px; }
</style>

<body>
<div class="lab">
  <b>One overview, dummy</b>
  <span class="grp">Event:
    <button id="ask">docs-site asks</button><button id="done">orbit-api turn done</button><button id="hide">Ctrl+Alt+L</button><button id="closeall">Close all project windows</button>

<script>
const COLORS = ["#818cf8", "#c08cf5", "#4fc9bd", "#ee8fbd", "#62b6ee", "#c3cf6c"];
const PALETTE = ["#7f95ff", "#4fc9bd", "#e391d0", "#c3cf6c", "#62b6ee", "#c08cf5", "#f0a060", "#6cc58e", "#e66a78", "#a9afb5"];
const SUGGESTED = "rocket book-open database server globe code terminal flask-conical leaf sprout brain bot shield layers package puzzle palette camera map compass house factory wallet receipt chart-line cpu cloud zap flame star heart anchor feather gem key-round landmark mountain trees satellite orbit telescope microscope notebook-pen newspaper graduation-cap briefcase shopping-cart truck plane ship bike coffee gamepad-2 film pen-tool hammer wrench bug sun moon snowflake tent castle".split(" ").filter((n) => LUCIDE[n]);
const EMOJI = {
  Technology: "🛰️ 🚀 🧪 🔬 🔧 🛠️ ⚙️ 💾 🖥️ 💡 🔋 📡 🤖 🧬 🧲 🔌",
  Nature: "🌲 🌵 🌊 🔥 ⛰️ 🌙 ☀️ ⭐ ❄️ 🌈 🍀 🌻 🌸 🍄 🌍 ⚡",
  Animals: "🦊 🐙 🦉 🐝 🐢 🦋 🐳 🦀 🐧 🦁 🐺 🦜 🐞 🦔 🐬 🦄",
  Places: "🏠 🏭 🏰 🏝️ 🗼 🏔️ 🏛️ 🏟️ 🗺️ 🧭 ⛺ 🚉",
  Things: "📚 🧾 🎨 🎵 📷 🎲 🧩 🎯 🔑 📦 🧰 🗂️ 📝 📊 💼 🏷️",
  Food: "☕ 🍎 🍋 🍕 🍩 🍪 🧁 🍇 🥕 🌶️",
  Symbols: "♻️ ⚓ 🔶 🔷 ❤️ ⚜️ ☯️ 🏁 ♾️ ⚛️",
};
// A few German words, so that searching in the interface's language finds something; the real list

const DE = { buch: "book", bücher: "book", geld: "money", rechnung: "bill", baum: "tree", wald: "forest", wetter: "weather", spiel: "game", musik: "music",
  gesundheit: "health", laden: "shop", einkauf: "shopping", auto: "car", rakete: "rocket", haus: "house", daten: "database", datenbank: "database", karte: "map",
  welt: "globe", ki: "ai", schule: "school", garten: "garden", essen: "food", reise: "travel", foto: "camera", sicherheit: "security", schloss: "lock",
  werkzeug: "tool", brief: "mail", nachricht: "message", gespräch: "chat", stern: "star", herz: "heart", blume: "flower", tier: "animal", hund: "dog",
  katze: "cat", vogel: "bird", fisch: "fish", berg: "mountain", meer: "sea", sonne: "sun", mond: "moon", feuer: "fire", wasser: "water", zeit: "time",
  uhr: "clock", kalender: "calendar", bild: "image", text: "text", schreiben: "write", stift: "pen", ordner: "folder", datei: "file", netz: "network",
  server: "server", wolke: "cloud", schiff: "ship", zug: "train", flugzeug: "plane", fahrrad: "bike", bau: "construction", fabrik: "factory", bank: "bank",
  kaffee: "coffee", lernen: "learn", wissen: "knowledge", forschung: "research", labor: "lab", roboter: "robot", gehirn: "brain", rechner: "computer" };
/** Icons for a search: whole words and word starts in names and keywords, names first. */
function searchIcons(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean).map((w) => DE[w] ?? w);
  if (!words.length) return null;
  const scored = [];
  for (const name of Object.keys(LUCIDE)) {
    const own = name.split("-"), tags = (LUCIDE_TAGS[name] ?? "").split(/[\s-]+/);
    let score = 0;
    for (const w of words) {
      const s = own.includes(w) ? 100 : w.length > 2 && own.some((t) => t.startsWith(w)) ? 60 : tags.includes(w) ? 40 : tags.some((t) => t.startsWith(w) && w.length > 2) ? 20 : 0;
      if (!s) { score = 0; break; }
      score += s - own.length; // shorter names first among equals: "book" before "book-open-text"
    }
    if (score > 0) scored.push([score, name]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].localeCompare(b[1])).map(([, n]) => n);

    { id: "c3", proj: "orbit-api", short: "C", color: 3, title: "Fix date picker CSS", status: "idle", why: "turn done 4 min ago", term: true },
    { id: "d1", proj: "ai-driven-development", short: "A", color: 1, title: "Kapitel 3 überarbeiten", status: "done", why: "turn done just now", remote: true },
    { id: "s1", proj: "docs-site", short: "A", color: 3, title: "Heading styles", status: "working", why: "running the build", remote: true, daily: true },
  ];
  front = "orbit-api"; ovHidden = false; pick = null; icon ??= "own"; folded = new Set(); otherOpen = false; autoStart = false; toastText = null; freshId = null;

  note("Calm by default: what waits, the projects with their sessions and status, which windows are open (▭). Everything else appears on hover (git, next prompt, workbench, doors) or sits behind the four icons at the top. Click a project: its window. Double-click a session: to it.");
}
function note(t) { lastNote = t; document.getElementById("note").innerHTML = t; }
const projOf = (n) => P.find((p) => p.name === n);
const live = (n) => S.filter((s) => s.proj === n && s.status !== "ended");
const asks = (n) => live(n).filter((s) => s.status === "waiting").length;
const dones = (n) => live(n).filter((s) => s.status === "done").length;
/** The project's mark: its icon, emoji or first letter on a circle in its colour. */
function glyph(m, name, size) {
  if (m.kind === "icon") return `<svg viewBox="0 0 24 24" width="${Math.round(size * 0.6)}" height="${Math.round(size * 0.6)}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[m.value] ?? ""}</svg>`;
  if (m.kind === "emoji") return `<span style="font-size:${Math.round(size * 0.62)}px">${m.value}</span>`;
  return `<span style="font-size:${Math.round(size * 0.52)}px;font-weight:700;color:#fff">${name[0].toUpperCase()}</span>`;
}
const markOf = (p, size = 18, m = p.mark) =>
  `<span class="mark" data-pick="${p.name}" title="${p.name}: change its mark" style="width:${size}px;height:${size}px;background:${m.kind === "emoji" ? m.color + "66" : m.color}${m.kind === "emoji" ? `;box-shadow:inset 0 0 0 ${Math.max(1, size / 14)}px ${m.color}` : ""}">${glyph(m, p.name, size)}</span>`;
const badge = (s) => `<span class="badge" style="background:${COLORS[s.color]}">${s.short}</span>`;
const stLabel = (s) => ({ working: "working", waiting: "asks", idle: "idle", done: "done", starting: "starting…" })[s.status];
const status = (n) => { const a = asks(n), d = dones(n); return [a && `${a} asking`, d && `${d} done`].filter(Boolean).join(" · "); };
// An emoji leads the title too: it shows even where the taskbar groups windows under one icon
const titleOf = (p) => { const st = status(p.name); return `${p.mark.kind === "emoji" ? p.mark.value + " " : ""}${p.name}${st ? " ● " + st : ""} – CodeDeck`; };

function render() {
  const desk = document.getElementById("desk");
  const open = P.filter((p) => p.open);
  // Project windows, the one in front on top
  const wins = open.map((p, i) => `
    <div class="win ${p.name === front ? "front" : ""}" data-win="${p.name}" style="left:${3 + i * 7}%;top:${5 + i * 8}%;width:${ovHidden ? 70 : 52}%;height:68%;z-index:${p.name === front ? 5 : p.z}">
      <div class="bar">${titleOf(p)}<span class="x" data-close="${p.name}" title="Close this window">×</span></div>
      <div class="body"><div class="deck"><div class="tabs"><span>Activity</span><span class="on">Changes</span><span>Workbench</span><span>Next prompt</span></div>
        <div class="ghost" style="width:60%"></div><div class="ghost" style="width:80%"></div><div class="ghost" style="width:45%"></div><div class="ghost" style="width:70%"></div></div>
        <div class="col"><b style="color:#d2d6da;display:flex;gap:6px;align-items:center">${markOf(p, 20)} ${p.name}</b>${live(p.name).map((s) => `<div>${badge(s)} ${s.title}</div>`).join("")}<span style="margin-top:auto;color:#6b7178">(full window; no sidebar form any more)</span></div></div>
    </div>`).join("");
  desk.innerHTML = wins + `<aside class="ov ${ovHidden ? "hidden" : ""}" id="ov">${overview()}</aside>` + taskbar() + (toastText ? `<div class="toast">${toastText}</div>` : "") + picker();
  bind();
}

const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
let menu = null;

function overview() {
  const needs = S.filter((s) => s.status === "waiting" || s.status === "done").sort((a, b) => (a.status === "waiting" ? 0 : 1) - (b.status === "waiting" ? 0 : 1));
  // One list: open windows first, then running sessions, then the rest of today's list
  const rank = (p) => (p.open ? 0 : live(p.name).length ? 1 : 2);
  const shown = P.filter((p) => p.open || live(p.name).length || p.daily).sort((a, b) => rank(a) - rank(b));
  const toStart = P.filter((p) => p.daily && !live(p.name).length).length;
  return `
    <div class="tbar"><span class="logo" style="margin-right:6px"></span>
      <span class="sp"></span>
      <button class="ti ${menu === "start" ? "open" : ""}" id="mstart" title="${toStart ? `Start today's list: ${toStart} without a session` : "Today's list: all running"}">${svg("play")}${toStart ? `<span class="cnt2">${toStart}</span>` : ""}</button>
      <button class="ti ${menu === "open" ? "open" : ""}" id="mopen" title="Open a project (Ctrl+O)">${svg("plus")}</button>
      <button class="ti" title="Settings (Ctrl+,)">${svg("gear")}</button>
      <button class="ti ${menu === "more" ? "open" : ""}" id="mmore" title="More">${svg("more")}</button>
    </div>
    ${menuHtml(toStart)}
    ${needs.length ? `<div class="sec">Needs you</div>` + needs.map((s) => `
      <div class="card ${s.status === "waiting" ? "asks" : ""} ${s.id === freshId ? "fresh" : ""}" data-s="${s.id}" title="Double-click: go to it · middle click: terminal">${markOf(projOf(s.proj), 20).replace('data-pick=', 'data-front-mark=')}
        <span style="flex:1;min-width:0"><b style="color:#f5f6f7">${s.title}</b><br><span class="${s.status === "waiting" ? "waiting" : "done"}" style="font-size:12px">${s.why}</span></span>${badge(s)}</div>`).join("") : ""}
    <div class="sec">Projects</div>
    ${shown.map(projectRow).join("")}`;
}
function projectRow(p) {
  const a = asks(p.name), d = dones(p.name), sessions = live(p.name);
  const bad = p.git?.includes("failed");
  const dot = a ? "#e0a868" : d ? "#6cc58e" : bad ? "#e66a78" : null;
  const idleDaily = p.daily && !sessions.length;
  const hov = [
    p.open ? `<span class="hi ${bad ? "warn" : ""}" data-tab="Changes" data-p="${p.name}" title="Git: ${p.git}">${svg("git")}</span>` : "",
    p.open && p.next ? `<span class="hi" data-tab="Next prompt" data-p="${p.name}" title="Next prompt: ${p.next} attached">${svg("mail")}</span>` : "",
    p.open && p.news ? `<span class="hi" data-tab="Workbench" data-p="${p.name}" title="Workbench: ${p.news} new">${svg("bench")}</span>` : "",
    idleDaily ? `<span class="hi" data-start="${p.name}" title="Start its session in the background (no window opens)">${svg("play")}</span>` : "",
  ].join("");
  return `<div class="pj ${p.open ? "" : "closed"}">
    <div class="pr ${p.name === front && p.open ? "front" : ""}" data-front="${p.name}" title="${p.open ? "Click: bring its window to the front" : "Click: open it in a window"}">${markOf(p, 22)}
      <span class="nm">${p.name}</span>
      ${p.open ? `<span class="winmark" title="Its window is open">${svg("win")}</span>` : ""}
      <span class="hov">${hov}</span>
      <span class="rest">${dot ? `<span class="dot" style="background:${dot}"></span>` : idleDaily ? `<span class="quiet">${p.last ? "▶ continues" : "not running"}</span>` : ""}</span>
    </div>
    ${sessions.map((s) => `<div class="sr" data-s="${s.id}" title="Double-click: go to it (Desktop, else terminal) · middle click: terminal · click: details in the project window">${badge(s)}<span class="t">${s.title}</span>
      <span class="rest"><span class="w ${s.status}">${stLabel(s)}</span></span>
      <span class="hov"><span class="w ${s.status}" style="margin-right:4px">${stLabel(s)}</span>${s.remote ? `<span class="hi" data-door="desktop" data-sid="${s.id}" title="Open in Claude Desktop">${svg("desktop")}</span>` : ""}<span class="hi" data-door="terminal" data-sid="${s.id}" title="Open in a terminal">${svg("term")}</span></span></div>`).join("")}
  </div>`;
}
function menuHtml(toStart) {
  if (menu === "start") return `<div class="menu2" style="right:70px">
      <div class="mi" id="startall">${svg("play").replace("<svg", '<svg width="14" height="14"')} Start today's list <small>${toStart ? `${toStart} to start` : "all running"}</small></div>
      <label class="mi"><input type="checkbox" id="auto" ${autoStart ? "checked" : ""}> Start it whenever CodeDeck starts</label>
      <div class="sep"></div><div class="mi">Edit today's list… <small>★ on any project</small></div></div>`;
  if (menu === "open") {
    const others = P.filter((p) => !p.open);
    return `<div class="menu2" style="right:40px"><input class="search" placeholder="Find a project or folder…">
      ${others.map((p) => `<div class="mi" data-openp="${p.name}">${markOf(p, 16).replace('data-pick=', 'data-x=')} ${p.name}<small>${live(p.name).length ? "running" : p.daily ? "★ today" : p.seen ?? ""}</small></div>`).join("")}
      <div class="sep"></div><div class="mi">Open folder…<small>Ctrl+O</small></div></div>`;
  }
  if (menu === "more") return `<div class="menu2" style="right:8px">
      <div class="mi">Usage <small>78 % of the week</small></div>
      <div class="mi">In the background <small>${S.filter((s) => s.remote).length} sessions, all reachable</small></div>
      <div class="sep"></div><div class="mi">Keyboard shortcuts <small>F1</small></div><div class="mi">About CodeDeck</div><div class="mi">Quit</div></div>`;
  return "";
}
function taskbar() {
  const open = P.filter((p) => p.open);
  const unread = S.filter((s) => s.status === "waiting" || s.status === "done").length;
  const ico = (p) => {
    if (icon === "plain") return `<span class="ico"><span class="base">◆</span>${unread ? `<span class="cnt">${unread}</span>` : ""}</span>`;
    const a = asks(p.name), d = dones(p.name);
    return `<span class="ico">${markOf(p, 22)}
      ${a ? `<span class="st" style="background:#e0a868"></span>` : d ? `<span class="st" style="background:#6cc58e"></span>` : ""}${unread ? `<span class="cnt">${unread}</span>` : ""}</span>`;
  };
  return `<div class="task"><span class="menu"></span>
    ${open.map((p) => `<div class="tb ${p.name === front && !ovHidden ? "front" : p.name === front ? "front" : ""} ${p.blink ? "blink" : ""}" data-front="${p.name}" title="${titleOf(p)}">${ico(p)}<span class="lbl">${titleOf(p)}</span></div>`).join("")}
    <div class="tb" id="tbov" title="CodeDeck overview"><span class="ico"><span class="base">◆</span></span><span class="lbl">CodeDeck</span></div></div>`;
}

function bind() {
  const q = (sel) => document.querySelectorAll(sel);
  q("[data-front]").forEach((el) => (el.onclick = (e) => { if (e.target.closest("[data-fold],[data-tab]")) return; e.stopPropagation(); toFront(el.dataset.front); }));
  q("[data-fold]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const n = el.dataset.fold; folded.has(n) ? folded.delete(n) : folded.add(n); render(); }));
  q("[data-tab]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toFront(el.dataset.p, false); note(`${el.dataset.p} comes to the front with its tab <b>${el.dataset.tab}</b> open.`); }));
  q("[data-s]").forEach((el) => {
    el.ondblclick = () => go(el.dataset.s, "desktop");
    el.onauxclick = (e) => { if (e.button === 1) go(el.dataset.s, "terminal"); };
    el.onclick = (e) => { if (e.target.closest("[data-front]")) return; const s = S.find((x) => x.id === el.dataset.s); if (projOf(s.proj).open) { toFront(s.proj, false); note(`Click on a session: ${s.proj} comes to the front with the details of “${s.title}” open in its right column.`); } };
  });
  q("[data-start]").forEach((el) => (el.onclick = () => start(projOf(el.dataset.start))));
  q("[data-openp]").forEach((el) => (el.onclick = () => openProject(el.dataset.openp)));
  q("[data-close]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const p = projOf(el.dataset.close); p.open = false; if (front === p.name) front = P.find((x) => x.open)?.name;
    note(`${p.name}'s window is closed. Its sessions keep running and stay in the overview (${p.daily ? "under Today" : "under Other projects"}); CodeDeck ends only when the last window, the overview included, closes.`); render(); }));
  q(".win").forEach((el) => (el.onmousedown = () => { if (front !== el.dataset.win) { front = el.dataset.win; render(); } }));
  q(".ov [data-pick], .win [data-pick]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const p = projOf(el.dataset.pick); pick = { name: p.name, ...p.mark, tab: p.mark.kind === "letter" ? "icon" : p.mark.kind, q: "" }; render(); }));
  bindPick();
  const tog = (id, k) => { const b = document.getElementById(id); if (b) b.onclick = (e) => { e.stopPropagation(); menu = menu === k ? null : k; render(); }; };
  tog("mstart", "start"); tog("mopen", "open"); tog("mmore", "more");
  const all = document.getElementById("startall"); if (all) all.onclick = () => { menu = null; P.filter((p) => p.daily && !live(p.name).length).forEach((p, i) => setTimeout(() => start(p, true), i * 400)); note("Starts every project of today's list that has no session yet, one after the other. No window opens."); render(); };
  q("[data-door]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); go(el.dataset.sid, el.dataset.door); }));
  q("[data-front-mark]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toFront(el.dataset.frontMark); }));
  const auto = document.getElementById("auto"); if (auto) auto.onchange = () => { autoStart = auto.checked; note(autoStart ? "Today's projects start by themselves whenever CodeDeck starts." : "No start by itself any more; ▶ All stays."); };
  document.getElementById("ov").onclick = (e) => { if (menu && !e.target.closest(".menu2, .ti")) { menu = null; render(); } };
  document.getElementById("tbov").onclick = () => { ovHidden = !ovHidden; render(); };
}
function picker() {
  if (!pick) return "";
  const p = projOf(pick.name), m = { kind: pick.kind, value: pick.value, color: pick.color };
  const q = pick.q.trim().toLowerCase();
  let grid = "";
  if (pick.tab === "icon") {
    const all = Object.keys(LUCIDE);
    const list = searchIcons(q) ?? SUGGESTED;
    grid = `<div class="glabel">${q ? `${list.length} of ${all.length} icons · names and keywords, also some German words` : `Suggested · type to search all ${all.length} icons by name and keyword`}</div>` +
      list.slice(0, 400).map((n) => `<button class="cell ${m.kind === "icon" && m.value === n ? "on" : ""}" data-icon-pick="${n}" title="${n}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[n]}</svg></button>`).join("");
  } else if (pick.tab === "emoji") {
    grid = Object.entries(EMOJI).map(([g, list]) => `<div class="glabel">${g}</div>` + list.split(" ").map((e) => `<button class="cell ${m.kind === "emoji" && m.value === e ? "on" : ""}" data-emoji-pick="${e}">${e}</button>`).join("")).join("");
  } else {
    grid = `<div class="glabel" style="text-transform:none;letter-spacing:0;font-size:12px">The first letter of the project's name, “${p.name[0].toUpperCase()}”. Every new project starts like this, in a colour of its own.</div>`;
  }
  return `<div class="dlg" id="dlg"><div class="box">
    <h4>Mark for ${p.name}</h4>
    <div class="prev">${markOf(p, 56, m)}<span><span class="tb" style="width:200px;background:#0b0c0e;cursor:default"><span class="ico">${markOf(p, 22, m)}<span class="st" style="background:#e0a868"></span></span><span class="lbl">${m.kind === "emoji" ? m.value + " " : ""}${p.name} ● 1 asking – CodeDeck</span></span><small>taskbar</small></span>
      <span>${markOf(p, 16, m)}<small>16 px</small></span></div>
    <div class="row" style="display:flex;gap:10px;align-items:center"><span class="segs">${[["icon", "Icons"], ["emoji", "Emoji"], ["letter", "Letter"]].map(([k, l]) => `<button data-tab-pick="${k}" class="${pick.tab === k ? "on" : ""}">${l}</button>`).join("")}</span>
      ${pick.tab === "icon" ? `<input class="search" id="pq" placeholder="Search: rocket, bill, weather, Buch, Rechnung…" value="${pick.q}" style="flex:1">` : ""}</div>
    <div class="grid">${grid}</div>
    <div><div class="glabel" style="padding-left:0">Colour</div><div class="swatches">${PALETTE.map((c) => `<button class="sw ${m.color === c ? "on" : ""}" data-color-pick="${c}" style="background:${c}"></button>`).join("")}</div></div>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="pcancel">Cancel</button><button class="btn pri" id="pok">Use</button></div>
  </div></div>`;
}
function bindPick() {
  if (!pick) return;
  const q = (sel) => document.querySelectorAll(sel);
  q("[data-tab-pick]").forEach((b) => (b.onclick = () => { pick.tab = b.dataset.tabPick; if (pick.tab === "letter") pick.kind = "letter"; render(); }));
  q("[data-icon-pick]").forEach((b) => (b.onclick = () => { pick.kind = "icon"; pick.value = b.dataset.iconPick; render(); }));
  q("[data-emoji-pick]").forEach((b) => (b.onclick = () => { pick.kind = "emoji"; pick.value = b.dataset.emojiPick; render(); }));
  q("[data-color-pick]").forEach((b) => (b.onclick = () => { pick.color = b.dataset.colorPick; render(); }));
  const input = document.getElementById("pq");
  if (input) { input.oninput = () => { pick.q = input.value; const at = input.selectionStart; render(); const i = document.getElementById("pq"); i.focus(); i.setSelectionRange(at, at); }; if (pick.focus !== false) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }
  document.getElementById("pcancel").onclick = () => { pick = null; render(); };
  document.getElementById("pok").onclick = () => { const p = projOf(pick.name); p.mark = { kind: pick.kind, value: pick.value, color: pick.color };
    note(`${p.name} now shows its mark in the overview, its window's header and taskbar icon (with the status dot)${p.mark.kind === "emoji" ? ", and its emoji leads the window title" : ""}. Kept per project in ~/.config/codedeck.`); pick = null; render(); };
  document.getElementById("dlg").onclick = (e) => { if (e.target.id === "dlg") { pick = null; render(); } };
}
function toFront(name, say = true) {
  const p = projOf(name);
  if (!p.open) return openProject(name);
  front = name; p.blink = false;
  if (say) note(`${name}'s window comes to the front (the way a taskbar does it, so Cinnamon grants the focus). The overview stays where it is.`);
  render();
}
function go(id, door) {
  const s = S.find((x) => x.id === id);
  toastText = door === "terminal" ? `Terminal opens on “${s.title}” (tmux attach)` : s.remote ? `Claude Desktop shows “${s.title}”` : `Terminal window of “${s.title}” comes to the front`;
  note(door === "terminal" ? "Middle click: always the terminal." : "Double-click: Desktop where there is one (Remote Control and the account's Desktop profile), else the terminal. Works from the overview without opening the project window.");
  render(); setTimeout(() => { toastText = null; render(); }, 1800);
}
function openProject(name) {
  menu = null;
  const p = projOf(name); p.open = true; p.git ??= "clean"; p.next ??= 0; p.news ??= 0; p.z = 3; front = name;
  note(`${name} opens in a window of its own and gets a block under Open projects.`); render();
}
function start(p, quiet) {
  if (live(p.name).length) return;
  const s = { id: "n" + Date.now() + p.name, proj: p.name, short: "A", color: 4, title: p.last ?? p.name, status: "starting", why: p.last ? "continuing…" : "starting…", remote: true, daily: true };
  p.last = null; S.push(s);
  if (!quiet) note(`Starts ${p.name}'s session in tmux with Remote Control. No window opens; the overview shows how it comes up.`);
  render(); setTimeout(() => { s.status = "idle"; s.why = "waiting for your prompt"; render(); }, 1300);
}

document.getElementById("ask").onclick = () => {
  const s = S.find((x) => x.id === "s1"); s.status = "waiting"; s.why = "asks: which heading style?"; freshId = "s1"; setTimeout(() => (freshId = null), 1700);
  note("docs-site has no window open, yet its question comes in at the top of the overview, with the project's name. Double-click answers it in Desktop. No project window needs to be open for that.");
  render();
};
document.getElementById("done").onclick = () => {
  const s = S.find((x) => x.id === "b2"); s.status = "done"; s.why = "turn done just now"; freshId = "b2"; setTimeout(() => (freshId = null), 1700); projOf("orbit-api").blink = true;
  note("orbit-api's window asks for attention in the taskbar (it blinks there, only this one). With “own icon per window” its icon gets the green dot; the title starts with the project's name, so cut short it still says which window it is. The red number is Cinnamon's count of unread notifications: per program, so on every CodeDeck icon alike.");
  render();
};
document.getElementById("hide").onclick = () => { ovHidden = !ovHidden; note(ovHidden ? "Ctrl+Alt+L hides the overview; project windows stay. The same keys bring it back from anywhere." : "The overview is back, at the right edge of the monitor it was on."); render(); };
document.getElementById("closeall").onclick = () => { P.forEach((p) => (p.open = false)); front = null; note("No project window left: the overview stays and is the start page. Sessions keep running and still show; today's list starts with ▶ All. Quit is in ⋯."); render(); };
document.getElementById("reset").onclick = () => { reset(); marks(); render(); };
document.querySelectorAll("[data-icon]").forEach((b) => (b.onclick = () => { icon = b.dataset.icon; marks(); note(icon === "plain" ? "Today: every window shows the same CodeDeck icon; only the (cut) title tells them apart." : "Own icon per window (to try in a spike): the project's colour or emoji, and a dot for what waits: amber asks, green done."); render(); }));
document.addEventListener("keydown", (e) => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "l") document.getElementById("hide").click(); if (e.key === "Escape" && pick) { pick = null; render(); } });
function marks() {
  document.querySelectorAll("[data-icon]").forEach((b) => b.classList.toggle("on", b.dataset.icon === icon));
}
reset(); marks(); render();
</script>
</body>
</html>
