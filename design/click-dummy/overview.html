<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeDeck: one overview for all projects, click dummy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #101214; color: #e8eaec; font: 13px/1.4 system-ui, "Noto Sans", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
  /* Not part of the product */
  .lab { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px; background: #f0efe9; color: #2a2a2a; }
  .lab b { font-size: 12px; }
  .lab .grp { display: flex; align-items: center; gap: 4px; }
  .lab button { height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid #b9b7ad; background: #fff; font-size: 12px; }
  .lab button.on { background: #2a2a2a; color: #fff; border-color: #2a2a2a; }
  .note { flex-shrink: 0; padding: 6px 14px; background: #fbf3e0; color: #5a4a1f; font-size: 12px; border-bottom: 1px solid #e3d6ae; min-height: 30px; }
  /* The desktop */
  .desk { flex: 1; min-height: 0; position: relative; background: radial-gradient(circle at 30% 20%, #2a3140, #14171c 70%); overflow: hidden; }
  .win { position: absolute; border: 1px solid #3a3f46; border-radius: 8px; overflow: hidden; background: #1b1e22; box-shadow: 0 12px 36px #0009; display: flex; flex-direction: column; transition: box-shadow .2s; }
  .win.front { box-shadow: 0 0 0 2px #818cf8, 0 16px 44px #000c; }
  .win .bar { height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #2b2f35; font-size: 12px; color: #d2d6da; white-space: nowrap; overflow: hidden; }
  .win .bar .x { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; background: #c0504d; color: #fff; font-size: 10px; line-height: 16px; text-align: center; flex-shrink: 0; }
  .win .body { flex: 1; display: flex; min-height: 0; }
  .win .deck { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .win .col { width: 30%; border-left: 1px solid #30343a; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #a9afb5; }
  .ghost { height: 11px; border-radius: 4px; background: #262a30; }
  .tabs { display: flex; gap: 6px; font-size: 11px; color: #8d949b; }
  .tabs span.on { color: #f0f1f2; }
  /* The overview */
  .ov { position: absolute; top: 0; right: 0; bottom: 40px; width: 330px; background: #1f2226; border-left: 1px solid #3a3f46; display: flex; flex-direction: column; overflow: auto; box-shadow: -8px 0 24px #0006; transition: transform .2s; }
  .ov.hidden { transform: translateX(110%); }
  .head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 12px; border-bottom: 1px solid #30343a; position: sticky; top: 0; background: #1f2226; z-index: 1; }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #818cf8, #4fc9bd); }
  .ib { width: 26px; height: 26px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: #c4c9ce; }
  .ib:hover { background: #30343a; color: #fff; }
  .area { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #a9afb5; }
  .area .ml { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .plus { height: 22px; padding: 0 8px; border-radius: 5px; border: 1px solid #4d545c; color: #d2d6da; font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .plus:hover { background: #30343a; }
  .plus[disabled] { opacity: .4; cursor: default; }
  .auto { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; }
  .card { margin: 4px 10px; padding: 7px 9px; border-radius: 7px; background: #262a30; border: 1px solid #3a3f46; display: flex; align-items: center; gap: 8px; user-select: none; }
  .card.asks { border-color: #b58a3a; }
  .card.fresh { animation: glow 1.6s ease-out; }
  @keyframes glow { from { box-shadow: 0 0 0 3px #e0a86899; transform: translateX(12px); } to { box-shadow: 0 0 0 0 transparent; transform: none; } }
  .chip { font-size: 11px; padding: 0 5px; border-radius: 4px; background: #30343a; color: #c4c9ce; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: #3a3f46; color: #fff; }
  .badge { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #111; flex-shrink: 0; }
  .badge.off { background: transparent; border: 1px dashed #4d545c; }
  .mark { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .proj { margin: 6px 8px; border-radius: 8px; background: #23272c; border: 1px solid #30343a; }
  .proj.front { border-color: #6366f1; }
  .ph { display: flex; align-items: center; gap: 7px; padding: 7px 8px; cursor: pointer; user-select: none; }
  .ph:hover { background: #2a2e34; border-radius: 8px; }
  .ph .name { font-weight: 600; color: #f0f1f2; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph .chev { width: 14px; color: #8d949b; font-size: 10px; }
  .stat { font-size: 11px; color: #a9afb5; white-space: nowrap; }
  .stat.bad { color: #e66a78; }
  .stat .n { padding: 0 5px; border-radius: 8px; background: #30343a; cursor: pointer; }
  .stat .n:hover { background: #3a3f46; color: #fff; }
  .srow { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px 32px; font-size: 12px; user-select: none; cursor: default; }
  .srow:hover { background: #2a2e34; }
  .srow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e3e5e8; }
  .working { color: #818cf8; } .waiting { color: #e0a868; } .idle { color: #a9afb5; } .done { color: #6cc58e; } .starting { color: #62b6ee; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 6px 12px; user-select: none; }
  .prow:hover { background: #24282d; }
  .prow small { display: block; color: #a9afb5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .pname { color: #f0f1f2; cursor: pointer; }
  .prow .pname:hover { text-decoration: underline; }
  .play { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #4d545c; font-size: 10px; flex-shrink: 0; }
  .play:hover { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .remote { color: #4fc9bd; font-size: 11px; }
  .foot { margin-top: auto; padding: 8px 12px; border-top: 1px solid #30343a; font-size: 12px; color: #a9afb5; display: flex; gap: 10px; }
  .foot .ml { margin-left: auto; }
  /* The desktop's taskbar */
  .task { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #0b0c0e; border-top: 1px solid #2c2f34; display: flex; align-items: center; gap: 4px; padding: 0 8px; }
  .task .menu { width: 28px; height: 28px; border-radius: 6px; background: #2a2e34; margin-right: 8px; }
  .tb { width: 168px; height: 32px; border-radius: 5px; display: flex; align-items: center; gap: 7px; padding: 0 8px; color: #d8dadd; font-size: 12px; cursor: pointer; position: relative; }
  .tb:hover { background: #1d2024; }
  .tb.front { background: #262a30; box-shadow: inset 0 -2px 0 #818cf8; }
  .tb.blink { animation: blink 1s 3; }
  @keyframes blink { 50% { background: #5a4520; } }
  .tb .lbl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .ico { width: 22px; height: 22px; position: relative; flex-shrink: 0; }
  .ico .base { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #3b3f8f, #1e5f5a); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .ico .bar2 { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; border-radius: 0 0 6px 6px; }
  .ico .st { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #0b0c0e; }
  .ico .cnt { position: absolute; right: -6px; bottom: -4px; min-width: 14px; height: 14px; border-radius: 7px; background: #c0504d; color: #fff; font-size: 9px; text-align: center; line-height: 14px; padding: 0 3px; }
  .toast { position: absolute; z-index: 30; left: 50%; bottom: 56px; transform: translateX(-50%); padding: 8px 14px; border-radius: 16px; background: #f0efe9; color: #2a2a2a; font-size: 12px; }
  .empty { padding: 20px; color: #6b7178; font-size: 12px; }
</style>
</head>
<body>
<div class="lab">
  <b>One overview, dummy</b>
  <span class="grp">Event:
    <button id="ask">docs-site asks</button><button id="done">orbit-api turn done</button><button id="hide">Ctrl+Alt+L</button><button id="closeall">Close all project windows</button>
  </span>
  <span class="grp">Mark per project:
    <button data-mark="color">colour</button><button data-mark="emoji">emoji</button>
  </span>
  <span class="grp">Taskbar:
    <button data-icon="plain">app icon only</button><button data-icon="own">own icon per window</button>
  </span>
  <button id="reset">Reset</button>
</div>
<div class="note" id="note"></div>
<div class="desk" id="desk"></div>

<script>
const COLORS = ["#818cf8", "#c08cf5", "#4fc9bd", "#ee8fbd", "#62b6ee", "#c3cf6c"];
let P, S, front, ovHidden, mark, icon, folded, otherOpen, autoStart, toastText, freshId, lastNote;
function reset() {
  P = [
    { name: "orbit-api", open: true, color: "#7f95ff", emoji: "🛰️", git: "3 uncommitted · ↑2", next: 2, news: 0, daily: true, z: 2 },
    { name: "ai-driven-development", open: true, color: "#4fc9bd", emoji: "🧠", git: "clean", next: 0, news: 3, daily: true, z: 1 },
    { name: "docs-site", open: false, color: "#ee8fbd", emoji: "📚", daily: true },
    { name: "billing-ui", open: false, color: "#c3cf6c", emoji: "🧾", daily: true, last: "Invoice table paging" },
    { name: "homepage", open: false, color: "#62b6ee", emoji: "🏠", daily: false, seen: "opened 3 days ago" },
    { name: "playground", open: false, color: "#c08cf5", emoji: "🧪", daily: false, seen: "opened yesterday" },
  ];
  S = [
    { id: "a1", proj: "orbit-api", short: "A", color: 0, title: "Auth refactor", status: "waiting", why: "needs your permission: npm test", remote: true },
    { id: "b2", proj: "orbit-api", short: "B", color: 2, title: "API docs refresh", status: "working", why: "editing docs/api.md", remote: true },
    { id: "c3", proj: "orbit-api", short: "C", color: 3, title: "Fix date picker CSS", status: "idle", why: "turn done 4 min ago", term: true },
    { id: "d1", proj: "ai-driven-development", short: "A", color: 1, title: "Kapitel 3 überarbeiten", status: "done", why: "turn done just now", remote: true },
    { id: "s1", proj: "docs-site", short: "A", color: 3, title: "Heading styles", status: "working", why: "running the build", remote: true, daily: true },
  ];
  front = "orbit-api"; ovHidden = false; mark ??= "color"; icon ??= "own"; folded = new Set(); otherOpen = false; autoStart = false; toastText = null; freshId = null;
  note("One overview at the right edge for every project, always there, also with no project open. Click a project's header: its window comes to the front. Double-click a session: to it (Desktop, else terminal). The taskbar below shows the windows with the project's name first.");
}
function note(t) { lastNote = t; document.getElementById("note").innerHTML = t; }
const projOf = (n) => P.find((p) => p.name === n);
const live = (n) => S.filter((s) => s.proj === n && s.status !== "ended");
const asks = (n) => live(n).filter((s) => s.status === "waiting").length;
const dones = (n) => live(n).filter((s) => s.status === "done").length;
const markOf = (p, size = 18) => mark === "emoji"
  ? `<span class="mark" style="background:#30343a;width:${size}px;height:${size}px">${p.emoji}</span>`
  : `<span class="mark" style="background:${p.color};width:${size}px;height:${size}px"></span>`;
const badge = (s) => `<span class="badge" style="background:${COLORS[s.color]}">${s.short}</span>`;
const stLabel = (s) => ({ working: "working", waiting: "asks", idle: "idle", done: "done", starting: "starting…" })[s.status];
const status = (n) => { const a = asks(n), d = dones(n); return [a && `${a} asking`, d && `${d} done`].filter(Boolean).join(" · "); };
const titleOf = (p) => { const st = status(p.name); return `${p.name}${st ? " ● " + st : ""} – CodeDeck`; };

function render() {
  const desk = document.getElementById("desk");
  const open = P.filter((p) => p.open);
  // Project windows, the one in front on top
  const wins = open.map((p, i) => `
    <div class="win ${p.name === front ? "front" : ""}" data-win="${p.name}" style="left:${3 + i * 7}%;top:${5 + i * 8}%;width:${ovHidden ? 70 : 52}%;height:68%;z-index:${p.name === front ? 5 : p.z}">
      <div class="bar">${mark === "emoji" ? p.emoji : `<span class="dot" style="background:${p.color}"></span>`} ${titleOf(p)}<span class="x" data-close="${p.name}" title="Close this window">×</span></div>
      <div class="body"><div class="deck"><div class="tabs"><span>Activity</span><span class="on">Changes</span><span>Workbench</span><span>Next prompt</span></div>
        <div class="ghost" style="width:60%"></div><div class="ghost" style="width:80%"></div><div class="ghost" style="width:45%"></div><div class="ghost" style="width:70%"></div></div>
        <div class="col"><b style="color:#d2d6da">Sessions · ${p.name}</b>${live(p.name).map((s) => `<div>${badge(s)} ${s.title}</div>`).join("")}<span style="margin-top:auto;color:#6b7178">(full window; no sidebar form any more)</span></div></div>
    </div>`).join("");
  desk.innerHTML = wins + `<aside class="ov ${ovHidden ? "hidden" : ""}" id="ov">${overview()}</aside>` + taskbar() + (toastText ? `<div class="toast">${toastText}</div>` : "");
  bind();
}

function overview() {
  const needs = S.filter((s) => s.status === "waiting" || s.status === "done").sort((a, b) => (a.status === "waiting" ? 0 : 1) - (b.status === "waiting" ? 0 : 1));
  const open = P.filter((p) => p.open), today = P.filter((p) => p.daily && !p.open), other = P.filter((p) => !p.daily && !p.open);
  const toStart = today.filter((p) => !live(p.name).length).length;
  return `
    <div class="head"><span class="logo"></span><b style="color:#f5f6f7">CodeDeck</b><span style="flex:1"></span>
      <button class="ib" title="Open folder… (Ctrl+O)" id="openf">📂</button><button class="ib" title="Settings (Ctrl+,)">⚙</button><button class="ib" title="About, Quit">⋯</button></div>
    ${needs.length ? `<div class="area">Needs you <span class="ml" style="color:${needs.some((s) => s.status === "waiting") ? "#e0a868" : "#a9afb5"}">${needs.length}</span></div>` + needs.map((s) => `
      <div class="card ${s.status === "waiting" ? "asks" : ""} ${s.id === freshId ? "fresh" : ""}" data-s="${s.id}" title="Double-click: go to it · middle click: terminal">${badge(s)}
        <span style="flex:1;min-width:0"><b style="color:#f5f6f7">${s.title}</b> <span class="chip" data-front="${s.proj}">${s.proj}</span><br><span class="${s.status === "waiting" ? "waiting" : "done"}" style="font-size:12px">${s.why}</span></span></div>`).join("") : ""}
    <div class="area">Open projects <span class="ml">${open.length}</span></div>
    ${open.length ? open.map(block).join("") : `<div class="empty">No project open. Open one from Today, Other projects or with 📂; the overview stays as your radar.</div>`}
    ${today.length ? `<div class="area">Today <span class="ml"><label class="auto" title="Start today's projects whenever CodeDeck starts"><input type="checkbox" id="auto" ${autoStart ? "checked" : ""}>at start</label>
      <button class="plus" id="all" ${toStart ? "" : "disabled"}>▶ All${toStart ? ` (${toStart})` : ""}</button></span></div>` + today.map(prow).join("") : ""}
    <div class="area" style="cursor:pointer" id="other">${otherOpen ? "▾" : "▸"} Other projects <span class="ml">${other.length}</span></div>
    ${otherOpen ? other.map(prow).join("") : ""}
    <div class="foot"><span>${S.filter((s) => s.remote && s.status !== "ended").length} in background</span><span class="remote">⌔ ${S.filter((s) => s.remote).length} reachable</span><span class="ml" title="Usage this week">78 % week</span></div>`;
}
function block(p) {
  const f = folded.has(p.name), a = asks(p.name), d = dones(p.name);
  const dot = a ? "#e0a868" : d ? "#6cc58e" : "transparent";
  return `<div class="proj ${p.name === front ? "front" : ""}">
    <div class="ph" data-front="${p.name}" title="Bring the window to the front">
      <span class="chev" data-fold="${p.name}" title="${f ? "Unfold" : "Fold"}">${f ? "▸" : "▾"}</span>${markOf(p)}
      <span class="name">${p.daily ? "★ " : ""}${p.name}</span>
      ${f ? `<span class="dot" style="background:${dot}"></span>` : `<span class="stat ${p.git.includes("failed") ? "bad" : ""}">${p.git}</span>
      ${p.next ? `<span class="stat"><span class="n" data-tab="Next prompt" data-p="${p.name}" title="Open Next prompt there">✉ ${p.next}</span></span>` : ""}
      ${p.news ? `<span class="stat"><span class="n" data-tab="Workbench" data-p="${p.name}" title="Open the Workbench there">${p.news} new</span></span>` : ""}`}
    </div>
    ${f ? "" : live(p.name).map((s) => `<div class="srow" data-s="${s.id}" title="Double-click: go to it (Desktop, else terminal) · middle click: terminal · click: its details in the project window">${badge(s)}<span class="t">${s.title}</span><span class="${s.status}">${stLabel(s)}</span>${s.remote ? `<span class="remote" title="Reachable from anywhere">⌔</span>` : s.term ? `<span title="Started by hand in a terminal">⌨</span>` : ""}</div>`).join("") || `<div class="srow" style="color:#6b7178">no session</div>`}
  </div>`;
}
function prow(p) {
  const m = live(p.name)[0];
  const st = m ? `<span class="${m.status}">${stLabel(m)}</span> · ${m.why}` : p.daily ? (p.last ? `not running · ▶ continues “${p.last}”` : "not running") : p.seen;
  return `<div class="prow" data-p="${p.name}">${m ? badge(m) : markOf(p)}
    <span style="flex:1;min-width:0"><span class="pname" data-openp="${p.name}" title="Open ${p.name} in a window">${p.name}</span><small>${st}</small></span>
    ${!m && p.daily ? `<button class="play" data-start="${p.name}" title="Start its session in the background; no window opens">▶</button>` : m?.remote ? `<span class="remote">⌔</span>` : ""}</div>`;
}
function taskbar() {
  const open = P.filter((p) => p.open);
  const unread = S.filter((s) => s.status === "waiting" || s.status === "done").length;
  const ico = (p) => {
    if (icon === "plain") return `<span class="ico"><span class="base">◆</span>${unread ? `<span class="cnt">${unread}</span>` : ""}</span>`;
    const a = asks(p.name), d = dones(p.name);
    return `<span class="ico"><span class="base">${mark === "emoji" ? p.emoji : "◆"}</span>${mark === "color" ? `<span class="bar2" style="background:${p.color}"></span>` : ""}
      ${a ? `<span class="st" style="background:#e0a868"></span>` : d ? `<span class="st" style="background:#6cc58e"></span>` : ""}${unread ? `<span class="cnt">${unread}</span>` : ""}</span>`;
  };
  return `<div class="task"><span class="menu"></span>
    ${open.map((p) => `<div class="tb ${p.name === front && !ovHidden ? "front" : p.name === front ? "front" : ""} ${p.blink ? "blink" : ""}" data-front="${p.name}" title="${titleOf(p)}">${ico(p)}<span class="lbl">${titleOf(p)}</span></div>`).join("")}
    <div class="tb" id="tbov" title="CodeDeck overview"><span class="ico"><span class="base">◆</span></span><span class="lbl">CodeDeck</span></div></div>`;
}

function bind() {
  const q = (sel) => document.querySelectorAll(sel);
  q("[data-front]").forEach((el) => (el.onclick = (e) => { if (e.target.closest("[data-fold],[data-tab]")) return; e.stopPropagation(); toFront(el.dataset.front); }));
  q("[data-fold]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const n = el.dataset.fold; folded.has(n) ? folded.delete(n) : folded.add(n); render(); }));
  q("[data-tab]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toFront(el.dataset.p, false); note(`${el.dataset.p} comes to the front with its tab <b>${el.dataset.tab}</b> open.`); }));
  q("[data-s]").forEach((el) => {
    el.ondblclick = () => go(el.dataset.s, "desktop");
    el.onauxclick = (e) => { if (e.button === 1) go(el.dataset.s, "terminal"); };
    el.onclick = (e) => { if (e.target.closest("[data-front]")) return; const s = S.find((x) => x.id === el.dataset.s); if (projOf(s.proj).open) { toFront(s.proj, false); note(`Click on a session: ${s.proj} comes to the front with the details of “${s.title}” open in its right column.`); } };
  });
  q("[data-start]").forEach((el) => (el.onclick = () => start(projOf(el.dataset.start))));
  q("[data-openp]").forEach((el) => (el.onclick = () => openProject(el.dataset.openp)));
  q("[data-close]").forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const p = projOf(el.dataset.close); p.open = false; if (front === p.name) front = P.find((x) => x.open)?.name;
    note(`${p.name}'s window is closed. Its sessions keep running and stay in the overview (${p.daily ? "under Today" : "under Other projects"}); CodeDeck ends only when the last window, the overview included, closes.`); render(); }));
  q(".win").forEach((el) => (el.onmousedown = () => { if (front !== el.dataset.win) { front = el.dataset.win; render(); } }));
  const all = document.getElementById("all"); if (all) all.onclick = () => { P.filter((p) => p.daily && !p.open && !live(p.name).length).forEach((p, i) => setTimeout(() => start(p, true), i * 400)); note("Starts every project of today's list that has no session yet, one after the other. No window opens."); };
  const auto = document.getElementById("auto"); if (auto) auto.onchange = () => { autoStart = auto.checked; note(autoStart ? "Today's projects start by themselves whenever CodeDeck starts." : "No start by itself any more; ▶ All stays."); };
  document.getElementById("other").onclick = () => { otherOpen = !otherOpen; render(); };
  document.getElementById("openf").onclick = () => note("A folder picker; the project opens in a new window and gets its own block here.");
  document.getElementById("tbov").onclick = () => { ovHidden = !ovHidden; render(); };
}
function toFront(name, say = true) {
  const p = projOf(name);
  if (!p.open) return openProject(name);
  front = name; p.blink = false;
  if (say) note(`${name}'s window comes to the front (the way a taskbar does it, so Cinnamon grants the focus). The overview stays where it is.`);
  render();
}
function go(id, door) {
  const s = S.find((x) => x.id === id);
  toastText = door === "terminal" ? `Terminal opens on “${s.title}” (tmux attach)` : s.remote ? `Claude Desktop shows “${s.title}”` : `Terminal window of “${s.title}” comes to the front`;
  note(door === "terminal" ? "Middle click: always the terminal." : "Double-click: Desktop where there is one (Remote Control and the account's Desktop profile), else the terminal. Works from the overview without opening the project window.");
  render(); setTimeout(() => { toastText = null; render(); }, 1800);
}
function openProject(name) {
  const p = projOf(name); p.open = true; p.git ??= "clean"; p.next ??= 0; p.news ??= 0; p.z = 3; front = name;
  note(`${name} opens in a window of its own and gets a block under Open projects.`); render();
}
function start(p, quiet) {
  if (live(p.name).length) return;
  const s = { id: "n" + Date.now() + p.name, proj: p.name, short: "A", color: 4, title: p.last ?? p.name, status: "starting", why: p.last ? "continuing…" : "starting…", remote: true, daily: true };
  p.last = null; S.push(s);
  if (!quiet) note(`Starts ${p.name}'s session in tmux with Remote Control. No window opens; the overview shows how it comes up.`);
  render(); setTimeout(() => { s.status = "idle"; s.why = "waiting for your prompt"; render(); }, 1300);
}

document.getElementById("ask").onclick = () => {
  const s = S.find((x) => x.id === "s1"); s.status = "waiting"; s.why = "asks: which heading style?"; freshId = "s1"; setTimeout(() => (freshId = null), 1700);
  note("docs-site has no window open, yet its question comes in at the top of the overview, with the project's name. Double-click answers it in Desktop. No project window needs to be open for that.");
  render();
};
document.getElementById("done").onclick = () => {
  const s = S.find((x) => x.id === "b2"); s.status = "done"; s.why = "turn done just now"; freshId = "b2"; setTimeout(() => (freshId = null), 1700); projOf("orbit-api").blink = true;
  note("orbit-api's window asks for attention in the taskbar (it blinks there, only this one). With “own icon per window” its icon gets the green dot; the title starts with the project's name, so cut short it still says which window it is. The red number is Cinnamon's count of unread notifications: per program, so on every CodeDeck icon alike.");
  render();
};
document.getElementById("hide").onclick = () => { ovHidden = !ovHidden; note(ovHidden ? "Ctrl+Alt+L hides the overview; project windows stay. The same keys bring it back from anywhere." : "The overview is back, at the right edge of the monitor it was on."); render(); };
document.getElementById("closeall").onclick = () => { P.forEach((p) => (p.open = false)); front = null; note("No project window left: the overview stays and is the start page. Sessions keep running and still show; today's list starts with ▶ All. Quit is in ⋯."); render(); };
document.getElementById("reset").onclick = () => { reset(); marks(); render(); };
document.querySelectorAll("[data-mark]").forEach((b) => (b.onclick = () => { mark = b.dataset.mark; marks(); note(mark === "emoji" ? "Each project gets an emoji of your choice: in the overview, the window's title bar and its taskbar icon." : "Each project gets a colour (by default): a square in the overview, a stripe under the taskbar icon."); render(); }));
document.querySelectorAll("[data-icon]").forEach((b) => (b.onclick = () => { icon = b.dataset.icon; marks(); note(icon === "plain" ? "Today: every window shows the same CodeDeck icon; only the (cut) title tells them apart." : "Own icon per window (to try in a spike): the project's colour or emoji, and a dot for what waits: amber asks, green done."); render(); }));
document.addEventListener("keydown", (e) => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "l") document.getElementById("hide").click(); });
function marks() {
  document.querySelectorAll("[data-mark]").forEach((b) => b.classList.toggle("on", b.dataset.mark === mark));
  document.querySelectorAll("[data-icon]").forEach((b) => b.classList.toggle("on", b.dataset.icon === icon));
}
reset(); marks(); render();
</script>
</body>
</html>
