<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeDeck: sessions everywhere (MVP 3), click dummy</title>
<style>
  * { box-sizing: border-box; }

  .detail { margin: 6px 0 4px 28px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }

  .doors { display: flex; flex-wrap: wrap; gap: 5px; }

  .door:hover { background: #30343a; }
  .door.def { border-color: #6366f1; }

  .seg { display: inline-flex; border: 1px solid #4d545c; border-radius: 5px; overflow: hidden; }

  .seg button.on { background: #4f46e5; color: #fff; }

  .qr i { display: block; }
  footer { flex-shrink: 0; min-height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 12px; background: #24272c; border-top: 1px solid #3a3f46; font-size: 12px; color: #a9afb5; }
  footer .ml { margin-left: auto; }
  /* Other programs the dummy pretends to switch to */
  .os { position: absolute; z-index: 20; border-radius: 8px; overflow: hidden; box-shadow: 0 16px 48px #000c; border: 1px solid #555; display: flex; flex-direction: column; }
  .os .bar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #3a3a3a; color: #ddd; font-size: 12px; }
  .os .bar .x { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; background: #c0504d; color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .term { background: #0c0c0c; color: #d0d0d0; padding: 10px 12px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; flex: 1; }
  .term .st { background: #1f6f3f; color: #fff; }
  .desk { flex: 1; display: flex; background: #262624; color: #e9e6dc; }
  .desk .nav { width: 210px; background: #1f1e1c; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }

  .bubble { align-self: flex-end; background: #3a3935; padding: 8px 12px; border-radius: 10px; max-width: 70%; }

  .toast .row { justify-content: flex-end; }
  .switchbar { position: absolute; z-index: 25; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 6px 12px; border-radius: 16px; background: #f0efe9; color: #2a2a2a; font-size: 12px; display: flex; gap: 10px; align-items: center; }
  .switchbar button { text-decoration: underline; }
  .dlg { position: absolute; z-index: 15; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; }
  .dlg .box { width: 460px; padding: 16px; border-radius: 10px; background: #2b2f35; border: 1px solid #4d545c; display: flex; flex-direction: column; gap: 14px; }
  .dlg .set { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dlg .set span small { display: block; color: #8d949b; }
  /* Start page: the same column in sidebar form, without a project */
  .app.compact { flex: 0 0 auto; width: 340px; margin: 12px 24px 12px auto; }
  .app.compact .tabs, .app.compact .view, .app.compact footer { display: none; }
  .app.compact .side { width: 100%; border-left: 0; }
  .head .pm { font-weight: 600; color: #f5f6f7; padding: 3px 6px; margin-left: -6px; border-radius: 5px; }
  .head .pm:hover, .head .pm.open { background: #30343a; }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #818cf8, #4fc9bd); }
  .projchip { font-size: 11px; padding: 0 5px; border-radius: 4px; background: #30343a; color: #c4c9ce; cursor: pointer; font-weight: 400; }
  .projchip:hover { background: #3a3f46; color: #fff; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: default; user-select: none; }
  .prow:hover { background: #24282d; }
  .prow.cur { background: #262b31; }
  .prow .pname { color: #f0f1f2; cursor: pointer; }
  .prow .pname:hover { text-decoration: underline; }
  .prow small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.off { background: transparent; border: 1px dashed #4d545c; }
  .play { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #4d545c; color: #d2d6da; font-size: 10px; flex-shrink: 0; }
  .play:hover { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .pin { color: #4d545c; font-size: 13px; width: 18px; flex-shrink: 0; }
  .pin.on { color: #e0b84f; }
  .pin:hover { color: #f0d070; }
  .plus[disabled] { opacity: .4; cursor: default; }
  .auto { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #a9afb5; cursor: pointer; }
  .sfoot { padding: 8px 12px; border-top: 1px solid #30343a; font-size: 12px; color: #a9afb5; }
</style>
</head>
<body>
<div class="lab">
  <b>Sessions everywhere, dummy</b>
  <span class="grp">Window:
    <button data-win="project">Project open</button><button data-win="start">No project (start page)</button>
  </span>
  <span class="grp">Machine:
    <button data-env="x11">X11, tmux there</button><button data-env="wayland">Wayland</button><button data-env="notmux">No tmux</button>
  </span>
  <span class="grp">Desktop link:
    <button data-desk="yes">works</button><button data-desk="no">not (yet)</button>
  </span>
  <span class="grp">Event:
    <button id="fire">Desktop notification</button><button id="reboot">Computer restarted</button><button id="shutdown">Shut down…</button><button id="rclost">Remote Control lost</button><button id="launch">CodeDeck started</button>
  </span>
  <button id="reset">Reset</button>
</div>
<div class="note" id="note"></div>
<div class="stage" id="stage">
  <div class="app" id="app">
    <div class="tabs"><span class="tab">Activity</span><span class="tab on">Changes</span><span class="tab">Workbench</span><span class="tab">Next prompt</span></div>
    <div class="main">
      <div class="view">
        <div class="ghost" style="width:40%"></div><div class="ghost" style="width:70%"></div><div class="ghost" style="width:55%"></div>
        <div class="ghost" style="width:62%"></div><div class="ghost" style="width:30%"></div>
        <div style="margin-top:24px;font-size:12px">(Deck unchanged; this dummy is about the right column.)</div>
      </div>
      <aside class="side" id="side"></aside>
    </div>
    <footer><span>main ↑2</span><span>git</span><span class="ml" id="foot"></span></footer>
  </div>
</div>

<script>
const COLORS = ["#818cf8", "#c08cf5", "#4fc9bd", "#ee8fbd", "#62b6ee", "#c3cf6c"];
const ACCOUNTS = { work: { name: "Work", color: "#e5484d" }, private: { name: "Private", color: "#46a758" } };
const ICON = {
  bg: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 11h13"/><circle cx="4" cy="12.3" r=".5" fill="currentColor"/></svg>',
  term: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4 6l2 2-2 2M8 10h4"/></svg>',
  desktop: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1"/><path d="M5.5 13.5h5M8 11v2.5"/></svg>',
  remote: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 11.5a5 5 0 017 0M2.5 9a8 8 0 0111 0"/><circle cx="8" cy="13.5" r=".9" fill="currentColor"/></svg>',
  browser: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c2 2 2 10.4 0 12.4M8 1.8c-2 2-2 10.4 0 12.4"/></svg>',
  phone: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4.5" y="1.5" width="7" height="13" rx="1.5"/><path d="M7 12.5h2"/></svg>',
  ssh: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5l3 3-3 3M7.5 11H13"/></svg>',
  folder: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4.5v8a1 1 0 001 1h11a1 1 0 001-1v-6.5a1 1 0 00-1-1H8L6.5 3.5h-4a1 1 0 00-1 1z"/></svg>',
  gear: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>',
};
const PLACE_TEXT = {
  bg: "Runs in the background (tmux). Stays when you close windows; reachable from terminal, ssh and, with Remote Control, from Desktop, browser and phone.",
  term: "Runs in a terminal window you opened yourself. Closing that window ends it.",
  desktop: "Started in Claude Desktop. CodeDeck knows it from its log only: no live status.",
};

let banner0, S, P, sel, env, desk, dbl, pop, overlay, toast, dialog, nextColor, lastNote, win, cur, autoStart;
function reset() {
  S = [
    { id: "a1", proj: "orbit-api", daily: true, short: "A", color: 0, title: "Auth refactor", status: "waiting", why: "needs your permission: npm test", place: "bg", tmux: "codeck-orbit-api", remote: true, acct: "work", started: "08:12" },
    { id: "b2", proj: "orbit-api", short: "B", color: 2, title: "API docs refresh", status: "working", why: "editing docs/api.md", place: "bg", tmux: "codeck-orbit-api-B", remote: true, acct: "work", started: "09:40" },
    { id: "c3", proj: "orbit-api", short: "C", color: 3, title: "Fix date picker CSS", status: "idle", why: "turn done 4 min ago", place: "term", acct: "work", started: "10:05", termApp: "gnome-terminal" },
    { id: "d4", proj: "orbit-api", short: "D", color: 4, title: "Explain pagination", status: "idle", why: "from log only", place: "desktop", acct: "private", started: "10:30" },
    { id: "e5", proj: "orbit-api", short: "E", color: 1, title: "Release notes 2.3", status: "ended", why: "ended 07:55", place: "bg", tmux: "codeck-orbit-api-E", remote: true, acct: "work", started: "07:10", earlier: true },
    { id: "i1", proj: "infra", daily: true, short: "A", color: 4, title: "Terraform upgrade", status: "working", why: "running terraform plan", place: "bg", tmux: "codeck-infra", remote: true, acct: "work", started: "08:01" },
    { id: "s1", proj: "docs-site", daily: true, short: "A", color: 3, title: "Heading styles", status: "waiting", why: "asks: which heading style?", place: "bg", tmux: "codeck-docs-site", remote: true, acct: "private", started: "08:02" },
    { id: "p1", proj: "playground", short: "A", color: 5, title: "Try the new SDK", status: "idle", why: "started by hand · turn done", place: "term", acct: "private", started: "10:40", termApp: "kitty" },
  ];
  P = [
    { name: "orbit-api", daily: true, acct: "work" },
    { name: "infra", daily: true, acct: "work" },
    { name: "docs-site", daily: true, acct: "private" },
    { name: "billing-ui", daily: true, acct: "work", last: "Invoice table paging" },
    { name: "playground", daily: false, acct: "private", seen: "opened yesterday" },
    { name: "homepage", daily: false, acct: "private", seen: "opened 3 days ago" },
  ];
  banner0 = false; sel = null; env ??= "x11"; desk ??= "yes"; dbl ??= "terminal"; pop = null; overlay = null; toast = null; dialog = false; nextColor = 5;
  win ??= "project"; cur = "orbit-api"; autoStart ??= false;
  note("Click a session: details and the ways to it. Double-click (or Enter): go to it the default way. The small icon right of the status says where it runs; the teal arc means: reachable from anywhere (Remote Control).");
}
function note(t) { lastNote = t; document.getElementById("note").innerHTML = t; }
const sessOf = (id) => S.find((s) => s.id === id);
const projOf = (name) => P.find((p) => p.name === name);
const liveIn = (name) => S.filter((s) => s.proj === name && s.status !== "ended");
/** The session a project row stands for: today's session, else any live one (also hand-started) */
const mainOf = (p) => liveIn(p.name).find((s) => s.daily) ?? liveIn(p.name)[0];
const stLabel = (s) => ({ working: "working", waiting: "waiting", idle: s.place === "desktop" ? "known from log" : "idle", ended: "ended", starting: "starting…" })[s.status];
const remoteIcon = (s) => s.remote && s.status !== "ended" ? `<span class="remote ${s.rcLost ? "lost" : ""}" title="${s.rcLost ? "Not reachable from your phone: " + s.rcLost : "Reachable from anywhere (Remote Control)"}">${ICON.remote}</span>` : "";
const chip = (name) => `<span class="projchip" data-openp="${name}" title="Open ${name}">${name}</span>`;

/** The ways to a session, in this order; `def` is the one double-click takes */
function doors(s) {
  const d = [];
  if (s.status === "ended") return d;
  if (s.place === "bg" || s.place === "term") d.push({ k: "terminal", icon: ICON.term, label: "Terminal" });
  if (s.place === "desktop" || s.remote) d.push({ k: "desktop", icon: ICON.desktop, label: "Desktop", off: s.place !== "desktop" && (desk === "no" || !!s.rcLost) });
  if (s.remote) d.push({ k: "browser", icon: ICON.browser, label: "Browser", off: !!s.rcLost }, { k: "phone", icon: ICON.phone, label: "Phone…", off: !!s.rcLost });
  if (s.place === "bg") d.push({ k: "ssh", icon: ICON.ssh, label: "ssh" });
  return d;
}
function defaultDoor(s) {
  const d = doors(s).filter((x) => !x.off);
  return d.find((x) => x.k === dbl) ?? d.find((x) => x.k !== "phone" && x.k !== "ssh");
}

function render() {
  document.getElementById("app").classList.toggle("compact", win === "start");
  const side = document.getElementById("side");
  side.innerHTML = win === "start" ? startPage() : projectColumn();
  bindSide(side);
  document.getElementById("foot").innerHTML = footText();
  renderPop(); renderOverlay(); renderToast(); renderDialog();
}
const gearBtn = () => `<button class="ib ${dialog ? "open" : ""}" id="gear" title="Settings (Ctrl+,)">${ICON.gear}</button>`;
function footText() {
  const bg = S.filter((s) => s.place === "bg" && s.status !== "ended").length, r = S.filter((s) => s.remote && !s.rcLost && s.status !== "ended").length;
  return `${bg} in background · <span class="remote">${ICON.remote.replace("<svg", '<svg width="12" height="12" style="vertical-align:-2px"')}</span> ${r} reachable from anywhere`;
}

function go(s) {

      <div class="small hint">Needs ssh access to this computer. Several terminals can be attached at once.</div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" id="pc">Copy</button><button class="btn" id="px">Close</button></div>`;
  }
  side.appendChild(el);
  el.querySelector("#px").onclick = () => { pop = null; render(); };
  el.querySelector("#pc").onclick = () => { note("Copied."); pop = null; render(); };
}
function qr(seed) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) / 2 ** 32);
  const finder = (x, y) => [[0, 0], [18, 0], [0, 18]].some(([a, b]) => x >= a && x < a + 7 && y >= b && y < b + 7 && (x === a || x === a + 6 || y === b || y === b + 6 || (x > a + 1 && x < a + 5 && y > b + 1 && y < b + 5)));
  const inF = (x, y) => [[0, 0], [18, 0], [0, 18]].some(([a, b]) => x >= a - 1 && x < a + 8 && y >= b - 1 && y < b + 8);
  let o = "";
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) o += `<i style="background:${(inF(x, y) ? finder(x, y) : rnd() > 0.5) ? "#000" : "#fff"}"></i>`;
  return o;
}

function renderOverlay() {
  document.querySelectorAll(".os, .switchbar").forEach((p) => p.remove());
  if (!overlay) return;
  const stage = document.getElementById("stage");
  const s = overlay.s;
  const el = document.createElement("div");
  el.className = "os";
  el.style.cssText = "left:8%;top:6%;width:min(760px,80vw);height:72%";
  if (overlay.k === "term") {
    const tmux = s.place === "bg";
    el.innerHTML = `<div class="bar">${tmux ? `tmux: ${s.tmux}` : `${s.termApp}: ${s.proj}`}<span class="x">×</span></div>
      <div class="term">╭─────────────────────────────────────────────────────╮
│ ✻ Claude Code  ·  ${s.title.padEnd(32)}│
╰─────────────────────────────────────────────────────╯
${s.status === "waiting" ? `
 Bash command

   npm test

 Do you want to proceed?
 ❯ 1. Yes
   2. Yes, and don't ask again for npm test
   3. No, and tell Claude what to do differently (esc)
` : `
 ⏺ Updated docs/api.md (+42 −7)

 ╭───────────────────────────────────────────────────╮
 │ >                                                 │
 ╰───────────────────────────────────────────────────╯
`}
${s.remote ? "  /rc active · claude.ai/code/session_01…" : ""}

${tmux ? `<span class="st">[${s.tmux}] 0:claude*                          "${s.proj}" 11:58</span>` : ""}</div>`;
  } else if (overlay.k === "desktop") {
    el.innerHTML = `<div class="bar">Claude${s.acct === "private" ? " (Privat)" : " (Work)"}<span class="x">×</span></div>
      <div class="desk"><div class="nav"><b style="padding:5px 7px">Code</b>${S.filter((x) => x.remote || x.place === "desktop").filter((x) => x.status !== "ended").map((x) => `<div class="${x.id === s.id ? "on" : ""}">${x.place === "desktop" ? "" : "⇄ "}${x.title}</div>`).join("")}
        <div style="margin-top:auto;color:#8b877c;font-size:11px">⇄ = remote session on this computer</div></div>
      <div class="conv"><div style="color:#8b877c;font-size:12px">${s.place === "desktop" ? "Local session · ~/projects/${s.proj}" : "Remote Control · workstation · ~/projects/${s.proj}"}</div>
        <div class="bubble">${s.status === "waiting" ? "Run the tests after the refactor" : "Refresh the endpoint docs from the OpenAPI spec"}</div>
        <div>${s.status === "waiting" ? "Claude wants to run <code>npm test</code>. <b>Allow</b> · <b>Deny</b>" : "Updated docs/api.md with 4 new endpoints…"}</div></div></div>`;
  } else {
    el.innerHTML = `<div class="bar">Browser · claude.ai/code/session_01…<span class="x">×</span></div>
      <div class="desk"><div class="conv"><div style="color:#8b877c;font-size:12px">Remote Control · workstation · ${s.title}</div><div class="bubble">…</div><div>Same conversation as in the terminal.</div></div></div>`;
  }
  stage.appendChild(el);
  el.querySelector(".x").onclick = back;
  const bar = document.createElement("div");
  bar.className = "switchbar";
  bar.innerHTML = `Dummy: you are now in ${overlay.k === "term" ? "the terminal" : overlay.k === "desktop" ? "Claude Desktop" : "the browser"}. <button id="bk">Back to CodeDeck</button> <span style="color:#777">(Ctrl+Alt+C)</span>`;
  stage.appendChild(bar);
  bar.querySelector("#bk").onclick = back;
}
function back() { overlay = null; render(); note(lastNote); }

function renderToast() {
  document.querySelectorAll(".toast").forEach((p) => p.remove());
  if (!toast) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = toast.s
    ? `<b>CodeDeck · ${toast.s.proj}</b><span>${badge(toast.s)} ${toast.s.title} needs your permission: npm test</span><div class="row"><button class="btn" id="tx">Dismiss</button><button class="btn pri" id="to">Open</button></div>`
    : `<span>${toast.text}</span><div class="row"><button class="btn" id="tx">OK</button></div>`;
  document.getElementById("stage").appendChild(el);
  el.querySelector("#tx").onclick = () => { toast = null; render(); };
  const o = el.querySelector("#to");
  if (o) o.onclick = () => { const s = toast.s; toast = null; note("\"Open\" in the desktop notification goes straight to the session, the same way as a double-click (here: " + (defaultDoor(s)?.label ?? "–") + ")."); go(s); };
}

function renderDialog() {
  document.querySelectorAll(".dlg").forEach((p) => p.remove());
  if (!dialog) return;
  const el = document.createElement("div");
  el.className = "dlg";
  const opts = [["terminal", "Terminal"], ["desktop", "Desktop"], ["browser", "Browser"]];
  el.innerHTML = `<div class="box"><h4 style="margin:0">Settings · Sessions</h4>
    <div class="set"><span>Double-click on a session opens<small>Where it is not possible, the next one in the row</small></span>
      <span class="seg">${opts.map(([k, l]) => `<button data-dbl="${k}" class="${dbl === k ? "on" : ""}" ${k === "desktop" && desk === "no" ? "title='Claude Desktop cannot be told to open a session yet'" : ""}>${l}</button>`).join("")}</span></div>
    <div class="set"><span>Terminal<small>Found on this computer</small></span>
      <select><option>Automatic (gnome-terminal)</option><option>kitty</option><option>Tilix</option></select></div>
    <div class="set"><span>New sessions reachable from anywhere<small>Remote Control on at start; change it per session</small></span><input type="checkbox" checked></div>
    <div class="set"><span>After a computer restart<small>Background sessions that were running</small></span>
      <select><option>Ask</option><option>Restore automatically</option><option>Do nothing</option></select></div>
    <div class="set"><span>Start today's projects when CodeDeck starts<small>Same as “at start” on the start page</small></span><input type="checkbox" id="dauto" ${autoStart ? "checked" : ""}></div>
    <div class="set"><span>Start CodeDeck when I log in <span class="projchip" style="cursor:default">to decide</span><small>Needed to restore without a click; maybe only in the tray</small></span><input type="checkbox"></div>
    <div class="set"><span>Desktop profile per account<small>Which Claude Desktop starts for which account</small></span><span class="link">Accounts…</span></div>
    <div class="row" style="justify-content:flex-end"><button class="btn pri" id="dc">Done</button></div></div>`;
  document.getElementById("app").appendChild(el);
  el.querySelectorAll("[data-dbl]").forEach((b) => (b.onclick = () => { dbl = b.dataset.dbl; note(`Double-click now opens ${b.textContent} first; a session that cannot be opened there falls back to the next way.`); render(); }));
  el.querySelector("#dc").onclick = () => { dialog = false; render(); };
  el.querySelector("#dauto").onchange = (e) => { autoStart = e.target.checked; render(); };
}

document.querySelectorAll("[data-env]").forEach((b) => (b.onclick = () => { env = b.dataset.env; marks(); note({ x11: "X11 with tmux: everything works, windows of other programs can be brought to the front.", wayland: "Wayland: other programs' windows cannot be raised. CodeDeck opens a new terminal on the tmux session instead, or says where a hand-started session is.", notmux: "No tmux: + New still works, but the session lives in a terminal window and ends with it. CodeDeck shows how to install tmux." }[env]); render(); }));
document.querySelectorAll("[data-desk]").forEach((b) => (b.onclick = () => { desk = b.dataset.desk; marks(); note(desk === "yes" ? "Assumed: Claude Desktop opens a remote session by link. Still to be tried (spike in the concept)." : "If Desktop cannot be told which session to open, the Desktop button is greyed for background sessions and double-click falls back to the terminal. Desktop still lists them under Code."); render(); }));
document.getElementById("fire").onclick = () => { toast = { s: sessOf("a1") }; overlay = null; note("A desktop notification while CodeDeck is hidden. \"Open\" goes to the session, not just to CodeDeck."); render(); };
document.getElementById("reboot").onclick = () => {
  reset(); sel = null;
  for (const s of S) if (s.place === "bg" && s.status !== "ended") { s.cut = s.status === "working"; s.lost = true; s.status = "ended"; s.why = s.cut ? "turn cut off by restart" : "stopped by restart"; s.remote = s.remote; }
  note("After a restart CodeDeck compares its list of background sessions with tmux: both are gone, and the system started after they were last seen. Hand-started and Desktop sessions are not CodeDeck's to restore.");
  render();
};
document.getElementById("shutdown").onclick = () => {
  overlay = null; toast = null; render();
  const el = document.createElement("div"); el.className = "dlg";
  el.innerHTML = `<div class="box" style="background:#3a3a3a;border-color:#666"><b>Restart the computer?</b><span class="small">Some programs are still busy:</span>
    <div class="row" style="padding:6px 8px;background:#2b2b2b;border-radius:6px"><b>CodeDeck</b><span class="small hint">1 session is working (API docs refresh)</span></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="sx">Cancel</button><button class="btn pri" id="sr">Restart anyway</button></div></div>`;
  document.getElementById("stage").appendChild(el);
  note("The system's own dialog (here Cinnamon). CodeDeck holds a logind delay lock only while a session is working; it never blocks the restart.");
  el.querySelector("#sx").onclick = () => el.remove();
  el.querySelector("#sr").onclick = () => { el.remove(); document.getElementById("reboot").click(); };
};
document.getElementById("rclost").onclick = () => {
  const b = sessOf("b2"); if (!b || b.status === "ended") return;
  b.rcLost = "no contact with the Remote Control server for 30 minutes"; b.status = "idle"; b.why = "turn done 40 min ago"; sel = "b2";
  note("Claude Code wrote the disconnect into the conversation, and hook messages no longer carry a remote id: the arc turns amber. The fix in Claude Code would be typing /remote-control in the session; CodeDeck offers a restart instead, it never types into a session.");
  render();
};
document.getElementById("reset").onclick = () => { reset(); marks(); render(); };
document.querySelectorAll("[data-win]").forEach((b) => (b.onclick = () => { win = b.dataset.win; pop = null; sel = null; marks();
  note(win === "start" ? "No project open: the window is the start page, always in sidebar form. Needs you over all projects, today's list with ▶ and ▶ All, the other projects. Double-click a row: go to its session. Click a name: open the project." : "A project is open. Click its name (top left) for the project menu with today's list; Needs you also shows other projects."); render(); }));
document.getElementById("launch").onclick = () => {
  reset(); morning(); win = "start"; marks();
  if (autoStart) { render(); setTimeout(() => { startAll(); note("CodeDeck started with “at start” on: first it restores what a restart interrupted (nothing here), then it starts today's projects one after the other, each continuing its last conversation. No project opens; the window is the start page."); }, 500); }
  else { note("CodeDeck started, no project open: the window comes up as the start page in sidebar form. Today's projects are not running yet; ▶ All starts them, “at start” does it every time CodeDeck starts. The hand-started session in playground was found on its own."); render(); }
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && sel && !pop && !dialog && !overlay) go(sessOf(sel));
  if (e.key === "Escape") { if (overlay) back(); else { pop = null; dialog = false; render(); } }
  if (e.key === "N" && e.ctrlKey && e.shiftKey && win === "project") { e.preventDefault(); pop = { k: "new" }; render(); }
});
function marks() {
  document.querySelectorAll("[data-win]").forEach((b) => b.classList.toggle("on", b.dataset.win === win));
  document.querySelectorAll("[data-env]").forEach((b) => b.classList.toggle("on", b.dataset.env === env));
  document.querySelectorAll("[data-desk]").forEach((b) => b.classList.toggle("on", b.dataset.desk === desk));
}
reset(); marks(); render();
</script>
