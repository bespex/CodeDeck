name: Release

# Builds the .deb and the AppImage on Ubuntu 24.04 (glibc 2.39: current
# Ubuntu, Mint, Debian and their relatives). A tag v<version> publishes them
# as a release. workflow_dispatch only builds (artifacts, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json" >&2
            exit 1
          fi

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build .deb and AppImage
        env:
          # linuxdeploy's strip cannot read the .relr.dyn sections of Ubuntu 24.04 libraries
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          conf=src-tauri/tauri.conf.json
          version=$(jq -r .version $conf)
          name=$(jq -r .productName $conf)
          pkg=${name,,}
          bundle=src-tauri/target/release/bundle
          mkdir -p dist-release
          # Debian naming convention: lowercase package name
          cp $bundle/deb/*.deb "dist-release/${pkg}_${version}_amd64.deb"
          cp $bundle/appimage/*.AppImage "dist-release/${name}_${version}_amd64.AppImage"
          cd dist-release
          sha256sum *.deb *.AppImage > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist-release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            ## Install (Ubuntu 24.04+, Linux Mint 22+, Debian 13+)

            ```bash
            sudo apt install ./codedeck_*_amd64.deb
            ```

            Or run the AppImage directly (`chmod +x CodeDeck_*_amd64.AppImage`).
            Then start **CodeDeck** from the application menu or with `codedeck <directory>`.
            Verify the downloads with `sha256sum -c SHA256SUMS`.
