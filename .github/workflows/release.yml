name: Release

# Builds the .deb and the AppImage on Ubuntu 24.04 (glibc 2.39: current
# Ubuntu, Mint, Debian and their relatives). A tag v<version> publishes them
# as a release (latest.json there is what the AppImage's updater reads). workflow_dispatch only builds (artifacts, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json" >&2
            exit 1
          fi

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build .deb and AppImage
        env:
          # signs the AppImage for the updater (the key behind plugins.updater.pubkey)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy's strip cannot read the .relr.dyn sections of Ubuntu 24.04 libraries
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          conf=src-tauri/tauri.conf.json
          version=$(jq -r .version $conf)
          name=$(jq -r .productName $conf)
          # One name everywhere (D26): package, command and program are `codedeck`. Tauri names
          # the package after productName ("code-deck"), so it is repacked with the right name.
          # - Version with the epoch 1: the metapackage `codedeck` it replaces was 1.0.
          # - The viewers CodeDeck opens things in are recommended (the metapackage did that).
          # - `codeck`, the earlier name, stays as a link; the transitional package `codeck` 1.0
          #   (bespex/packages) pulls this one in, older `codeck` and `code-deck` are replaced.
          pkg=$(jq -r .mainBinaryName $conf)
          bundle=src-tauri/target/release/bundle
          mkdir -p dist-release
          work=$(mktemp -d)
          dpkg-deb -R $bundle/deb/*.deb "$work"
          sed -i "s/^Package: .*/Package: ${pkg}/; s/^Version: .*/Version: 1:${version}/" "$work/DEBIAN/control"
          printf 'Recommends: marq, dirq, jayq\nReplaces: code-deck, codeck (<< 1.0)\nConflicts: code-deck, codeck (<< 1.0)\nProvides: code-deck\n' >> "$work/DEBIAN/control"
          ln -s "$pkg" "$work/usr/bin/codeck"
          dpkg-deb --root-owner-group -b "$work" "dist-release/${pkg}_${version}_amd64.deb"
          dpkg-deb -f "dist-release/${pkg}_${version}_amd64.deb" Package Version
          image="${name}_${version}_amd64.AppImage"
          cp $bundle/appimage/*.AppImage "dist-release/$image"
          cp $bundle/appimage/*.AppImage.sig "dist-release/$image.sig"
          # latest.json is what the AppImage's updater reads (plugins.updater.endpoints)
          jq -n --arg version "$version" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg signature "$(cat "dist-release/$image.sig")" \
                --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$image" \
                '{version: $version, pub_date: $date,
                  platforms: {"linux-x86_64": {signature: $signature, url: $url}}}' \
                > dist-release/latest.json
          cd dist-release
          sha256sum *.deb *.AppImage > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist-release/*

      # The text of the release: release-notes/<version>.md (if there is one), then how to install;
      # the list of commits follows (generate_release_notes)
      - name: Release text
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          {
            if [ -f "release-notes/$version.md" ]; then cat "release-notes/$version.md"; echo; fi
            cat <<'TEXT'
          ## Install (Ubuntu 24.04+, Linux Mint 22+, Debian 13+)

          ```bash
          sudo apt install ./codedeck_*_amd64.deb
          ```

          Or run the AppImage directly (`chmod +x CodeDeck_*_amd64.AppImage`); it offers updates itself.
          Then start **CodeDeck** from the application menu or with `codedeck <directory>`.
          Verify the downloads with `sha256sum -c SHA256SUMS`.
          TEXT
          } > release-body.md
          cat release-body.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*
          generate_release_notes: true
          body_path: release-body.md

      # The APT repository (bespex/apt) rebuilds on a schedule, but GitHub runs scheduled workflows
      # only every few hours: the release asks for a run at once. Needs the secret APT_DISPATCH_TOKEN
      # (fine-grained token for bespex/apt, Actions: read and write); without it the step is skipped
      # and the schedule picks the release up later.
      - name: Update the APT repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No APT_DISPATCH_TOKEN: the APT repository's schedule picks the release up later."
            exit 0
          fi
          gh workflow run publish.yml -R bespex/apt
