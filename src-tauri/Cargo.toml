[package]
name = "codedeck"
version = "0.4.2"
description = "CodeDeck – AI session radar for Linux · be spex"
authors = ["Skrrytch <skrrytch@speckels.net>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/bespex/CodeDeck"
publish = false

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# (an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "codedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# One name everywhere (D26): the command is `codedeck` like the program; `codeck` is an alias
[[bin]]
name = "codedeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: the tray draws on the app icon's PNGs (src/tray.rs)
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Claude Code's settings keep their order when CodeDeck adds its hooks
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
tauri-plugin-dialog = "2"
# AppImage only: offers the newer signed release (latest.json) at start; APT keeps the .deb current
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# Already part of Tauri on Linux: which programs open which file type
gio = "0.18"
# Desktop notifications over D-Bus, with the click on one reported back (zbus is in the tree already)
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Bringing the window to the front as a pager does (X11): the desktop refuses the focus to a
# window that just asks for it. Already in the tree through the global shortcuts
x11rb = "0.13"
# Show/hide and sidebar from anywhere (X11; Wayland has no global shortcuts for apps)
tauri-plugin-global-shortcut = "2"
# The tray icon as in Maillet: StatusNotifierItem over D-Bus, reports the left click (src/tray.rs)
ksni = "0.3"
# setsid for programs CodeDeck starts (apps::detach); already in the tree
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
