[package]
name = "codedeck"
version = "0.1.1"
description = "CodeDeck – AI session radar for Linux · be spex"
authors = ["Skrrytch <skrrytch@speckels.net>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/bespex/CodeDeck"
publish = false

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# (an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519).
name = "codedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The command is `codeck` (D24); the package, files and folders keep the name CodeDeck
[[bin]]
name = "codeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# preserve_order: Claude Code's settings keep their order when CodeDeck adds its hooks
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Already part of Tauri on Linux: which programs open which file type
gio = "0.18"
# Desktop notifications over D-Bus, with the click on one reported back (zbus is in the tree already)
notify-rust = { version = "4", default-features = false, features = ["z"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
