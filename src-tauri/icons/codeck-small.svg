<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- For 16 and 24 px: the stack of the big icon, without glow and outlines; gaps of background
       keep the three layers apart, and the layers are thicker so they stay layers. Ground and light
       edge as in the big icon, so the tile stays visible on a dark panel -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f454d"/><stop offset="1" stop-color="#121417"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.42"/><stop offset="1" stop-color="#fff" stop-opacity="0.07"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <path d="M32 36 54 46 32 56 10 46Z" fill="#4f46e5"/>
  <path d="M32 24 54 34 32 44 10 34Z" fill="#818cf8"/>
  <path d="M32 8 54 19 32 30 10 19Z" fill="#f26500"/>
</svg>
